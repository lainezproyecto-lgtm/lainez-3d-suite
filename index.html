    #notes-panel { bottom: 20px; right: 20px; width: 340px; display: none; }

    .top-btn {

    .version-tag {

    .video-label {
      position: absolute; bottom: 4px; left: 6px; font-size: 0.62rem; font-weight: 600;

    h2, h3 { color: #e6ccb2; margin-bottom: 10px; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }
    .input-group { margin-bottom: 8px; }
    label { display: block; font-size: 0.75rem; color: #ddb892; margin-bottom: 3px; }
    input, select, button, textarea {
      width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid #7f5539;

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDocs, deleteDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDKMU3nyfvPPk44IFRJUS0S3EuM4xtA29M",
      authDomain: "lainez-3d-suite.firebaseapp.com",
      projectId: "lainez-3d-suite",
      storageBucket: "lainez-3d-suite.firebasestorage.app",
      messagingSenderId: "730194480138",
      appId: "1:730194480138:web:8c65d4abf6cddfa39da3f3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentRoomId = null;
    let isHost = false;
    let isRemoteUpdate = false;
    let selectedAvatarId = null;
    let lookAtMode = false;
    let linkMode = false;
    let isRemoteFocusActive = false;
    let isMirrorCamActive = false;
    let recognition = null;
    let isTranscribing = false;
    let baseNotesText = '';

    const urlParams = new URLSearchParams(window.location.search);
    const urlRoom = urlParams.get('room');
    const urlRole = urlParams.get('role');

    if (urlRoom) {
      document.getElementById('room-code-input').value = urlRoom.toUpperCase();
      if (urlRole === 'client') {
        document.getElementById('host-create-section').style.display = 'none';
        document.getElementById('user-name').placeholder = "Ej. Consultante";
      }
    }

    // WEBRTC MEDIA CONTROL
    let localStream = new MediaStream();
    let peerConnection = null;
    let isAudioConnected = false;
    let isMuted = false;
    let isCameraActive = false;

    const rtcServers = {
      iceServers: [
        { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] },
        { urls: ['stun:stun3.l.google.com:19302', 'stun:stun4.l.google.com:19302'] },
        { urls: 'stun:global.stun.twilio.com:3478' }
      ],
      iceCandidatePoolSize: 10,
    };

    signInAnonymously(auth)
      .then(() => showNotif("Conectado a Backend (v2.7)"))
      .catch((err) => console.error("Error Auth:", err));

    function showNotif(msg) {
      const notif = document.getElementById('notification');
      notif.innerText = msg;
      notif.style.display = 'block';
      setTimeout(() => { notif.style.display = 'none'; }, 2800);
    }

    function updateRoomInfoUI(roomId) {
      const roomInfo = document.getElementById('room-info');
      const btnHistory = document.getElementById('btn-open-history');
      
      if (isHost) {
        roomInfo.innerHTML = `
          <div>Sala Activa: <b id="current-room-code">${roomId}</b></div>
          <button id="btn-copy-code" class="btn-copy">🔗 Copiar Enlace Directo</button>
        `;

        document.getElementById('btn-copy-code').addEventListener('click', () => {
          const shareUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}&role=client`;
          navigator.clipboard.writeText(shareUrl).then(() => {
            showNotif("Enlace de acceso copiado al portapapeles");
          }).catch(err => console.error(err));
        });

        document.getElementById('join-section').style.display = 'none';
        document.getElementById('host-controls').style.display = 'block';
        btnHistory.style.display = 'block';
      } else {
        roomInfo.innerHTML = `<div>Conectado a Sala: <b>${roomId}</b></div>`;
        document.getElementById('host-controls').style.display = 'none';
        document.getElementById('btn-notes-toggle').style.display = 'none';
        btnHistory.style.display = 'none';
      }
    }

    function getSelectedAvatar() {
      if (!selectedAvatarId) return null;
      return avatars.find(a => a.userData.id === selectedAvatarId) || null;
    }

    async function ensureLocalMedia() {
      if (!isAudioConnected) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
          stream.getTracks().forEach(track => localStream.addTrack(track));
          isAudioConnected = true;
          isCameraActive = true;
          
          document.getElementById('audio-toggle-btn').innerText = "🎙️ Micrófono Activo";
          document.getElementById('audio-toggle-btn').classList.add('active-audio');
          
          document.getElementById('video-toggle-btn').innerText = "📹 Desconectar Cámara";
          document.getElementById('video-toggle-btn').classList.add('stopped-video');
          document.getElementById('remote-video-box').style.display = 'block';
        } catch (err) {
          console.warn("Captura audio fallback:", err);
          try {
            const audStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audStream.getAudioTracks().forEach(t => localStream.addTrack(t));
            isAudioConnected = true;
            document.getElementById('audio-toggle-btn').innerText = "🎙️ Micrófono Activo";
            document.getElementById('audio-toggle-btn').classList.add('active-audio');
          } catch (e) {
            console.error("Permiso denegado:", e);
          }
        }
      }
    }

    document.getElementById('audio-toggle-btn').addEventListener('click', async () => {
      const audioBtn = document.getElementById('audio-toggle-btn');
      const track = localStream.getAudioTracks()[0];
      
      if (track) {
        isMuted = !isMuted;
        track.enabled = !isMuted;
        if (isMuted) {
          audioBtn.innerText = "🔇 Mic Silenciado";
          audioBtn.classList.remove('active-audio');
          audioBtn.classList.add('muted-audio');
          showNotif("Micrófono silenciado");
        } else {
          audioBtn.innerText = "🎙️ Micrófono Activo";
          audioBtn.classList.remove('muted-audio');
          audioBtn.classList.add('active-audio');
          showNotif("Micrófono activo");
        }
      } else {
        await ensureLocalMedia();
      }
    });

    document.getElementById('video-toggle-btn').addEventListener('click', async () => {
      const videoBtn = document.getElementById('video-toggle-btn');
      const remoteBox = document.getElementById('remote-video-box');
      const track = localStream.getVideoTracks()[0];

      if (track) {
        track.enabled = !track.enabled;
        isCameraActive = track.enabled;
        if (isCameraActive) {
          videoBtn.innerText = "📹 Desconectar Cámara";
          videoBtn.classList.add('stopped-video');
          remoteBox.style.display = 'block';
          showNotif("Cámara encendida");
        } else {
          videoBtn.innerText = "📹 Ver Participante";
          videoBtn.classList.remove('stopped-video');
          remoteBox.style.display = 'none';
          showNotif("Cámara apagada");
        }
      } else {
        await ensureLocalMedia();
      }
    });

    async function setupWebRTCConnection() {
      await ensureLocalMedia();
      peerConnection = new RTCPeerConnection(rtcServers);

      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.ontrack = event => {
        const remoteAudio = document.getElementById('remote-audio');
        const remoteVideo = document.getElementById('remote-video');
        const remoteBox = document.getElementById('remote-video-box');

        if (event.streams && event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
          remoteVideo.srcObject = event.streams[0];
          remoteBox.style.display = 'block';
          remoteAudio.play().catch(e => console.log(e));
          remoteVideo.play().catch(e => console.log(e));
          showNotif("Transmisión recibida");
        }
      };

      const roomRef = doc(db, "rooms", currentRoomId);
      const callerCandidates = collection(roomRef, "callerCandidates");
      const calleeCandidates = collection(roomRef, "calleeCandidates");

      peerConnection.onicecandidate = event => {
        if (event.candidate) {
          const targetCol = isHost ? callerCandidates : calleeCandidates;
          addDoc(targetCol, event.candidate.toJSON());
        }
      };

      if (isHost) {
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await setDoc(roomRef, { offer: { type: offer.type, sdp: offer.sdp } }, { merge: true });

        onSnapshot(roomRef, async snapshot => {
          const data = snapshot.data();
          if (peerConnection && !peerConnection.currentRemoteDescription && data && data.answer) {
            const answer = new RTCSessionDescription(data.answer);
            await peerConnection.setRemoteDescription(answer);
          }
        });

        onSnapshot(calleeCandidates, snapshot => {
          snapshot.docChanges().forEach(async change => {
            if (change.type === 'added') {
              const candidate = new RTCIceCandidate(change.doc.data());
              await peerConnection.addIceCandidate(candidate);
            }
          });
        });
      } else {
        onSnapshot(roomRef, async snapshot => {
          const data = snapshot.data();
          if (peerConnection && !peerConnection.currentRemoteDescription && data && data.offer) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            await setDoc(roomRef, { answer: { type: answer.type, sdp: answer.sdp } }, { merge: true });
          }
        });

        onSnapshot(callerCandidates, snapshot => {
          snapshot.docChanges().forEach(async change => {
            if (change.type === 'added') {
              const candidate = new RTCIceCandidate(change.doc.data());
              await peerConnection.addIceCandidate(candidate);
            }
          });
        });
      }
    }

      recognition.onresult = (event) => {
        const notesArea = document.getElementById('session-notes');
        let finalTranscript = '';
        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalTranscript += transcript + ' ';
          else interimTranscript += transcript;
        }

        if (finalTranscript) baseNotesText += (baseNotesText ? '\n' : '') + finalTranscript.trim();
        notesArea.value = baseNotesText + (interimTranscript ? '\n[...' + interimTranscript + ']' : '');
        notesArea.scrollTop = notesArea.scrollHeight;
      };

      recognition.onerror = (e) => { if (isTranscribing) { try { recognition.start(); } catch(err) {} } };
      recognition.onend = () => { if (isTranscribing) { try { recognition.start(); } catch(err) {} } };

        bodyGroup.add(eyeR);

        const mouthMat = new THREE.MeshBasicMaterial({ color: 0x4a2810 });
        const mouthGeo = new THREE.BoxGeometry(0.14 * scaleXZ, 0.035 * scaleY, 0.03 * scaleXZ);
        const mouth = new THREE.Mesh(mouthGeo, mouthMat);
        mouth.position.set(0, head.position.y - 0.09 * scaleY, 0.25 * scaleXZ);
        bodyGroup.add(mouth);

        const noseGeo = new THREE.ConeGeometry(0.055 * scaleXZ, 0.15 * scaleY, 12);
        noseGeo.rotateX(Math.PI / 2);
        const nose = new THREE.Mesh(noseGeo, bodyMat);
        nose.position.set(0, head.position.y - 0.01 * scaleY, 0.27 * scaleXZ);
        bodyGroup.add(nose);

        const neckGeo = new THREE.CylinderGeometry(0.09 * scaleXZ, 0.1 * scaleXZ, 0.12 * scaleY, 12);
        const neck = new THREE.Mesh(neckGeo, bodyMat);
        neck.position.y = (1.48 * scaleY);
        bodyGroup.add(neck);

        const torsoTopWidth = isFemale ? (isVariant2 ? 0.28 : 0.30) : (isVariant2 ? 0.44 : 0.38);
        const torsoBotWidth = isFemale ? (isVariant2 ? 0.24 : 0.22) : (isVariant2 ? 0.30 : 0.26);
        const torsoGeo = new THREE.CylinderGeometry(torsoTopWidth * scaleXZ, torsoBotWidth * scaleXZ, 0.55 * scaleY, 16);
        const torso = new THREE.Mesh(torsoGeo, bodyMat);
        torso.position.y = (1.18 * scaleY);
        torso.castShadow = true;
        bodyGroup.add(torso);

        const hipGeo = new THREE.CylinderGeometry(torsoBotWidth * scaleXZ, (isFemale ? 0.28 : 0.24) * scaleXZ, 0.3 * scaleY, 16);
        const hip = new THREE.Mesh(hipGeo, bodyMat);
        hip.position.y = (0.78 * scaleY);
        hip.castShadow = true;
        bodyGroup.add(hip);

        const legGeo = new THREE.CylinderGeometry(0.08 * scaleXZ, 0.06 * scaleXZ, 0.65 * scaleY, 12);
        const legL = new THREE.Mesh(legGeo, bodyMat);
        legL.position.set(-0.11 * scaleXZ, 0.325 * scaleY, 0);
        legL.castShadow = true;
        bodyGroup.add(legL);

        const legR = new THREE.Mesh(legGeo, bodyMat);
        legR.position.set(0.11 * scaleXZ, 0.325 * scaleY, 0);
        legR.castShadow = true;
        bodyGroup.add(legR);

        const armGeo = new THREE.CylinderGeometry(0.065 * scaleXZ, 0.05 * scaleXZ, 0.55 * scaleY, 12);
        const armL = new THREE.Mesh(armGeo, bodyMat);
        armL.position.set((-torsoTopWidth - 0.05) * scaleXZ, 1.1 * scaleY, 0);
        armL.rotation.z = 0.15;
        armL.castShadow = true;
        bodyGroup.add(armL);

        const armR = new THREE.Mesh(armGeo, bodyMat);
        armR.position.set((torsoTopWidth + 0.05) * scaleXZ, 1.1 * scaleY, 0);
        armR.rotation.z = -0.15;
        armR.castShadow = true;
        bodyGroup.add(armR);
      }

      const auraGeo = new THREE.RingGeometry(0.55 * scaleXZ, 0.75 * scaleXZ, 32);
      auraGeo.rotateX(-Math.PI / 2);
      const auraMat = new THREE.MeshBasicMaterial({ color: initialClothesColor, side: THREE.DoubleSide });
      const aura = new THREE.Mesh(auraGeo, auraMat);
      aura.position.y = 0.02;
      group.add(aura);

      const canvas = document.createElement('canvas');
      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false, depthWrite: false });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.position.y = isLego ? 1.8 : (2.4 * scaleY);
      group.add(sprite);

      group.userData = {
        bodyGroup, bodyMaterial: bodyMat, clothesMaterial: clothesMat,
        auraMesh: aura, labelCanvas: canvas, labelTexture: texture,
        labelSprite: sprite, type, scaleY
      };

      return group;
    }

    function updateLabel(avatarGroup, text) {
      if (!avatarGroup || !avatarGroup.userData.labelCanvas) return;
      const canvas = avatarGroup.userData.labelCanvas;
      const ctx = canvas.getContext('2d');
      const displayText = text || "Persona";

      ctx.font = "Bold 52px 'Segoe UI', sans-serif";
      const textWidth = ctx.measureText(displayText).width;

      const paddingX = 60;
      const canvasWidth = Math.max(textWidth + paddingX * 2, 220);
      const canvasHeight = 120;

      canvas.width = canvasWidth;
      canvas.height = canvasHeight;

      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      ctx.fillStyle = "rgba(18, 14, 12, 0.90)";
      ctx.strokeStyle = "rgba(212, 163, 115, 0.85)";
      ctx.lineWidth = 6;
      
      ctx.beginPath();
      ctx.roundRect(12, 12, canvasWidth - 24, canvasHeight - 24, 24);
      ctx.fill();
      ctx.stroke();

      ctx.font = "Bold 52px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(displayText, canvasWidth / 2, canvasHeight / 2);

      avatarGroup.userData.labelTexture.needsUpdate = true;

      const spriteScaleX = (canvasWidth / 120) * 0.7;
      const spriteScaleY = (canvasHeight / 120) * 0.7;
      avatarGroup.userData.labelSprite.scale.set(spriteScaleX, spriteScaleY, 1);
    }

    function addAvatarToScene(data) {
      const avatarGroup = buildHumanMesh(data.type || 'lego-m');
      avatarGroup.position.set(data.x || 0, 0, data.z || 0);
      avatarGroup.rotation.y = data.rotation || 0;
      
      const userScale = (data.userScale || 100) / 100;
      avatarGroup.scale.set(userScale, userScale, userScale);

      avatarGroup.userData.id = data.id;
      avatarGroup.userData.label = data.label || 'Persona';
      avatarGroup.userData.emotion = data.emotion || 'neutral';
      avatarGroup.userData.posture = data.posture || 'standing';
      avatarGroup.userData.userScale = data.userScale || 100;

      updateLabel(avatarGroup, data.label);
      applyAvatarState(avatarGroup);

      scene.add(avatarGroup);
      avatars.push(avatarGroup);
      return avatarGroup;
    }

    function applyAvatarState(avatarGroup) {
      if (!avatarGroup) return;
      const emotionKey = avatarGroup.userData.emotion || 'neutral';
      const colorHex = EMOTION_COLORS[emotionKey] || EMOTION_COLORS.neutral;

      if (avatarGroup.userData.auraMesh) avatarGroup.userData.auraMesh.material.color.setHex(colorHex);
      
      const isLego = avatarGroup.userData.type && avatarGroup.userData.type.startsWith('lego-');
      if (isLego) {
        if (avatarGroup.userData.clothesMaterial) avatarGroup.userData.clothesMaterial.color.setHex(colorHex);
      } else {
        if (avatarGroup.userData.bodyMaterial) avatarGroup.userData.bodyMaterial.color.setHex(colorHex);
      }

      const posture = avatarGroup.userData.posture;
      const bodyGroup = avatarGroup.userData.bodyGroup;

      if (posture === 'bowing') {
        bodyGroup.rotation.x = Math.PI / 3.5;
        bodyGroup.position.set(0, -0.2, 0.3);
      } else if (posture === 'lying') {
        bodyGroup.rotation.x = Math.PI / 2;
        bodyGroup.position.set(0, 0.1, 0.8);
      } else {
        bodyGroup.rotation.x = 0;
        bodyGroup.position.set(0, 0, 0);
      }
    }

    function drawLinks() {
      links.forEach(l => scene.remove(l.lineMesh));
      links.length = 0;

      for (let i = 0; i < avatars.length; i++) {
        for (let j = i + 1; j < avatars.length; j++) {
          const a1 = avatars[i];
          const a2 = avatars[j];
          if (a1.userData.linkedTo === a2.userData.id || a2.userData.linkedTo === a1.userData.id) {
            const points = [
              new THREE.Vector3(a1.position.x, 0.1, a1.position.z),
              new THREE.Vector3(a2.position.x, 0.1, a2.position.z)
            ];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0xe76f51, linewidth: 3 });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            links.push({ lineMesh: line, id1: a1.userData.id, id2: a2.userData.id });
          }
        }
      }
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDragging = false;
    let dragTarget = null;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.panel') || e.target.closest('#top-bar') || e.target.closest('#remote-video-box')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(avatars, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && obj.parent !== scene) obj = obj.parent;

        const activeSelected = getSelectedAvatar();

        if (lookAtMode && activeSelected && activeSelected !== obj) {
          const dx = obj.position.x - activeSelected.position.x;
          const dz = obj.position.z - activeSelected.position.z;
          activeSelected.rotation.y = Math.atan2(dx, dz);
          lookAtMode = false;
          showNotif("Mirada orientada");
          saveStateToFirebase();
          return;
        }

        if (linkMode && activeSelected && activeSelected !== obj) {
          activeSelected.userData.linkedTo = obj.userData.id;
          linkMode = false;
          drawLinks();
          showNotif("Vínculo creado");
          saveStateToFirebase();
          return;
        }

        dragTarget = obj;
        isDragging = true;
        controls.enabled = false;
        selectAvatar(obj);
      } else {
        deselectAvatar();
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || !dragTarget) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(dragPlane);

      if (intersects.length > 0) {
        const point = intersects[0].point;
        dragTarget.position.x = point.x;
        dragTarget.position.z = point.z;
        if (selectHalo.visible) selectHalo.position.set(point.x, 0.03, point.z);
        drawLinks();
      }
    });

    window.addEventListener('pointerup', () => {
      if (isDragging && dragTarget) saveStateToFirebase();
      isDragging = false;
      dragTarget = null;
      controls.enabled = true;
    });

    function selectAvatar(avatarGroup) {
      if (!avatarGroup) return;
      selectedAvatarId = avatarGroup.userData.id;
      selectHalo.position.set(avatarGroup.position.x, 0.03, avatarGroup.position.z);
      selectHalo.visible = true;

      document.getElementById('inspector-panel').style.display = 'block';
      document.getElementById('insp-title').innerText = avatarGroup.userData.label;
      document.getElementById('insp-label').value = avatarGroup.userData.label;
      document.getElementById('insp-posture').value = avatarGroup.userData.posture;
      document.getElementById('insp-emotion').value = avatarGroup.userData.emotion;
      document.getElementById('insp-rotation').value = Math.round((avatarGroup.rotation.y * 180) / Math.PI);
      document.getElementById('insp-scale').value = avatarGroup.userData.userScale || 100;
    }

    function deselectAvatar() {
      selectedAvatarId = null;
      selectHalo.visible = false;
      lookAtMode = false;
      linkMode = false;
      document.getElementById('inspector-panel').style.display = 'none';
    }

    document.getElementById('insp-label').addEventListener('input', (e) => {
      const active = getSelectedAvatar();
      if (!active) return;
      active.userData.label = e.target.value;
      updateLabel(active, e.target.value);
      saveStateToFirebase();
    });

    document.getElementById('insp-posture').addEventListener('change', (e) => {
      const active = getSelectedAvatar();
      if (!active) return;
      active.userData.posture = e.target.value;
      applyAvatarState(active);
      saveStateToFirebase();
    });

    document.getElementById('insp-emotion').addEventListener('change', (e) => {
      const active = getSelectedAvatar();
      if (!active) return;
      active.userData.emotion = e.target.value;
      applyAvatarState(active);
      saveStateToFirebase();
    });

    document.getElementById('insp-rotation').addEventListener('input', (e) => {
      const active = getSelectedAvatar();
      if (!active) return;
      active.rotation.y = (e.target.value * Math.PI) / 180;
      saveStateToFirebase();
    });

    document.getElementById('insp-scale').addEventListener('input', (e) => {
      const active = getSelectedAvatar();
      if (!active) return;
      const scale = e.target.value / 100;
      active.userData.userScale = e.target.value;
      active.scale.set(scale, scale, scale);
      saveStateToFirebase();
    });

    document.getElementById('btn-look-at').addEventListener('click', () => { lookAtMode = true; showNotif("Haz clic en el avatar objetivo"); });
    document.getElementById('btn-link-to').addEventListener('click', () => { linkMode = true; showNotif("Haz clic en el avatar para vincular"); });
    document.getElementById('insp-deselect').addEventListener('click', deselectAvatar);

    document.getElementById('insp-delete').addEventListener('click', () => {
      const active = getSelectedAvatar();
      if (!active) return;
      scene.remove(active);
      const index = avatars.indexOf(active);
      if (index > -1) avatars.splice(index, 1);
      deselectAvatar();
      drawLinks();
      saveStateToFirebase();
    });

    let uiVisible = true;
    document.getElementById('view-toggle-btn').addEventListener('click', () => {
      if (!isHost && isRemoteFocusActive) return;
      uiVisible = !uiVisible;
      document.querySelectorAll('.panel').forEach(p => p.style.opacity = uiVisible ? '1' : '0');
      document.getElementById('view-toggle-btn').innerText = uiVisible ? '👁️ Focus' : '👁️ Mostrar Controles';
    });

    document.getElementById('btn-notes-toggle').addEventListener('click', () => {
      const p = document.getElementById('notes-panel');
      p.style.display = p.style.display === 'none' ? 'block' : 'none';
    });

    function saveStateToFirebase() {
      if (!currentRoomId || isRemoteUpdate) return;
      const dataAvatars = avatars.map(a => ({
        id: a.userData.id, label: a.userData.label || 'Persona', type: a.userData.type || 'lego-m',
        emotion: a.userData.emotion || 'neutral', posture: a.userData.posture || 'standing',
        userScale: Number(a.userData.userScale) || 100, linkedTo: a.userData.linkedTo || null,
        x: Number(a.position.x) || 0, z: Number(a.position.z) || 0, rotation: Number(a.rotation.y) || 0
      }));

      const roomRef = doc(db, "rooms", currentRoomId);
      setDoc(roomRef, { avatars: dataAvatars, updatedAt: new Date() }, { merge: true }).catch(err => console.error(err));
    }

    document.getElementById('btn-create-room').addEventListener('click', async () => {
      const userName = document.getElementById('user-name').value.trim() || 'Anfitrión';
      const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();

      try {
        const roomRef = doc(db, "rooms", roomId);
        await setDoc(roomRef, {
          createdBy: userName, createdAt: new Date(), remoteFocus: false,
          clientConnected: false, clientName: 'Ausente', avatars: []
        });
        
        isHost = true;
        currentRoomId = roomId;
        updateRoomInfoUI(roomId);
        showNotif(`Sala ${roomId} Creada (Anfitrión)`);
        listenToRoom(roomId);
        await setupWebRTCConnection();
      } catch (e) {
        console.error("Error al crear sala:", e);
        showNotif("Error backend");
      }
    });

    document.getElementById('btn-join-room').addEventListener('click', async () => {
      const roomId = document.getElementById('room-code-input').value.trim().toUpperCase();
      const userName = document.getElementById('user-name').value.trim() || 'Consultante';
      if (!roomId) return alert("Código inválido.");
      
      isHost = false;
      currentRoomId = roomId;
      updateRoomInfoUI(roomId);

      const roomRef = doc(db, "rooms", roomId);
      await setDoc(roomRef, { clientConnected: true, lastActive: Date.now(), clientName: userName }, { merge: true });

      setInterval(() => publishClientCameraState(), 3000);
      listenToRoom(roomId);
      await setupWebRTCConnection();
      showNotif(`Unido a ${roomId} (Consultante)`);
    });

    function listenToRoom(roomId) {
      onSnapshot(doc(db, "rooms", roomId), (docSnapshot) => {
        if (!docSnapshot.exists()) return;
        const data = docSnapshot.data();

        if (isHost) {
          const clientNameSpan = document.getElementById('client-name-status');
          const clientDot = document.getElementById('client-dot');
          const remoteLabel = document.getElementById('remote-video-label');
          const isRecentlyActive = data.lastActive && (Date.now() - data.lastActive < 8000);

          if (data.clientConnected && isRecentlyActive) {
            clientNameSpan.innerText = `${data.clientName || 'Consultante'}: Conectado`;
            remoteLabel.innerText = data.clientName || 'Consultante';
            clientDot.className = 'dot-online';
          } else if (data.clientName && data.clientName !== 'Ausente') {
            clientNameSpan.innerText = `${data.clientName}: Desconectado`;
            clientDot.className = 'dot-disconnected';
          } else {
            clientNameSpan.innerText = 'Consultante: Ausente';
            clientDot.className = 'dot-offline';
          }

          if (isMirrorCamActive && data.clientCameraPos && data.clientCameraTarget) {
            camera.position.set(data.clientCameraPos.x, data.clientCameraPos.y, data.clientCameraPos.z);
            controls.target.set(data.clientCameraTarget.x, data.clientCameraTarget.y, data.clientCameraTarget.z);
            controls.update();
          }
        } else {
          document.getElementById('remote-video-label').innerText = data.createdBy || 'Anfitrión';
        }

        if (!isHost && typeof data.remoteFocus === 'boolean') {
          isRemoteFocusActive = data.remoteFocus;
          const focusBtn = document.getElementById('view-toggle-btn');

          if (isRemoteFocusActive) {
            document.querySelectorAll('.panel').forEach(p => p.style.opacity = '0');
            focusBtn.innerText = '🔒 Guiado por Terapeuta';
            focusBtn.classList.add('disabled-btn');
            deselectAvatar();

            if (data.hostCameraPos && data.hostCameraTarget) {
              camera.position.set(data.hostCameraPos.x, data.hostCameraPos.y, data.hostCameraPos.z);
              controls.target.set(data.hostCameraTarget.x, data.hostCameraTarget.y, data.hostCameraTarget.z);
              controls.update();
            }
          } else {
            document.querySelectorAll('.panel').forEach(p => p.style.opacity = uiVisible ? '1' : '0');
            focusBtn.innerText = uiVisible ? '👁️ Focus' : '👁️ Mostrar Controles';
            focusBtn.classList.remove('disabled-btn');
          }
        }

        isRemoteUpdate = true;
        const currentSavedId = selectedAvatarId;

        avatars.forEach(a => scene.remove(a));
        avatars.length = 0;

        if (data.avatars && Array.isArray(data.avatars)) {
          data.avatars.forEach(aData => {
            const av = addAvatarToScene(aData);
            av.userData.linkedTo = aData.linkedTo || null;
          });
          drawLinks();
        }

        if (currentSavedId) {
          const reselected = avatars.find(a => a.userData.id === currentSavedId);
          if (reselected) selectAvatar(reselected);
          else deselectAvatar();
        }

        isRemoteUpdate = false;
      });
    }

    // LÓGICA DE AÑADIR ELEMENTOS (v2.7 - Prioriza la lista seleccionada)
    document.getElementById('add-avatar').addEventListener('click', () => {
      const labelInput = document.getElementById('avatar-label').value.trim();
      const humanSelect = document.getElementById('avatar-gender').value;
      const resourceSelect = document.getElementById('avatar-resource').value;

      let type = 'lego-m';
      let defaultLabel = 'Persona';

      if (resourceSelect !== 'none') {
        type = resourceSelect;
        const selectedOption = document.querySelector(`#avatar-resource option[value="${resourceSelect}"]`);
        defaultLabel = selectedOption ? selectedOption.text : 'Recurso';
      } else if (humanSelect !== 'none') {
        type = humanSelect;
        const selectedOption = document.querySelector(`#avatar-gender option[value="${humanSelect}"]`);
        defaultLabel = selectedOption ? selectedOption.text.split('-')[0].trim() : 'Representante';
      }

      const finalLabel = labelInput || defaultLabel;

      const newAvatar = addAvatarToScene({
        id: 'av_' + Date.now(),
        label: finalLabel,
        type: type,
        x: (Math.random() - 0.5) * 5,
        z: (Math.random() - 0.5) * 5,
        rotation: 0,
        emotion: 'neutral',
        posture: 'standing',
        userScale: 100
      });

      // Resetear opciones para la siguiente selección
      document.getElementById('avatar-gender').value = 'none';
      document.getElementById('avatar-resource').value = 'none';
      document.getElementById('avatar-label').value = '';

      selectAvatar(newAvatar);
      saveStateToFirebase();
    });

    document.getElementById('clear-board').addEventListener('click', () => {
      avatars.forEach(a => scene.remove(a));
      avatars.length = 0;
      deselectAvatar();
      drawLinks();
      saveStateToFirebase();
    });

    document.getElementById('btn-screenshot').addEventListener('click', () => {
      renderer.render(scene, camera);
      const dataURL = renderer.domElement.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = `Constelacion_${currentRoomId || 'local'}.png`;
      link.href = dataURL;
      link.click();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
